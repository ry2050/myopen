<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy by Design - iPhone Pro Max Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #020617;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        /* 針對 Figma 匯入優化的無圓角卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- iPhone Pro Max 容器 (1320x2868) -->
    <!-- 注意：此處為了預覽方便使用 flex，匯入 Figma 時將會以 1320x2868 呈現 -->
    <div class="w-[1320px] h-[2868px] bg-gradient-to-b from-[#0a192f] via-[#051125] to-[#020817] overflow-hidden flex flex-col items-center px-24 py-32 relative">
        
        <!-- 移除劉海裝飾 -->

        <!-- 標題區域 - 比例放大 -->
        <div class="text-center mt-32 space-y-12">
            <p class="text-[#10b981] font-bold text-3xl tracking-[0.3em] uppercase">
                Privacy
            </p>
            <h1 class="text-white text-9xl font-semibold tracking-tight leading-[1.1]">
                Private<br />by Design
            </h1>
            <p class="text-slate-400 text-5xl leading-relaxed px-20">
                No account. No tracking.<br />
                Your data stays on your device.
            </p>
        </div>

        <!-- 中央插圖區域 - 比例放大 -->
        <div class="relative flex-1 flex items-center justify-center w-full my-20">
            <!-- 背景光暈效果 -->
            <div class="absolute w-[800px] h-[800px] bg-emerald-500/10 rounded-full blur-[150px]"></div>
            
            <div class="relative z-10 scale-[2.5]">
                <!-- 盾牌 SVG -->
                <svg width="240" height="280" viewBox="0 0 160 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M80 10L140 35V90C140 135 115 175 80 190C45 175 20 135 20 90V35L80 10Z" stroke="#1e3a8a" stroke-width="2" fill="rgba(30, 58, 138, 0.2)"/>
                    <path d="M80 20L130 42V85C130 125 108 160 80 175C52 160 30 125 30 85V42L80 20Z" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4"/>
                </svg>
                
                <!-- 中央鎖頭 -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="bg-emerald-500 p-6 rounded-3xl shadow-[0_0_50px_rgba(16,185,129,0.6)]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#051125" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- 特色列表區域 - 比例放大 -->
        <div class="w-full space-y-10 mb-20 px-10">
            
            <!-- 特色 1 (移除圓角) -->
            <div class="glass-card p-12 flex items-center gap-12">
                <div class="bg-blue-900/30 p-8 border border-blue-500/20 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="space-y-2">
                    <h3 class="text-white font-bold text-5xl">No Account Required</h3>
                    <p class="text-slate-500 text-3xl">Start instantly, no sign-up needed</p>
                </div>
            </div>

            <!-- 特色 2 (移除圓角) -->
            <div class="glass-card p-12 flex items-center gap-12">
                <div class="bg-emerald-900/30 p-8 border border-emerald-500/20 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
                </div>
                <div class="space-y-2">
                    <h3 class="text-white font-bold text-5xl">Zero Tracking</h3>
                    <p class="text-slate-500 text-3xl">No analytics, no ads, no data collection</p>
                </div>
            </div>

            <!-- 特色 3 (移除圓角) -->
            <div class="glass-card p-12 flex items-center gap-12">
                <div class="bg-blue-900/30 p-8 border border-blue-500/20 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <div class="space-y-2">
                    <h3 class="text-white font-bold text-5xl">On-Device Only</h3>
                    <p class="text-slate-500 text-3xl">Your data never leaves your iPhone</p>
                </div>
            </div>

        </div>

        <!-- 底部 Home Indicator (改為直角背景或移除) -->
        <div class="w-64 h-3 bg-white/20 mt-auto mb-10"></div>
    </div>

</body>
</html>
